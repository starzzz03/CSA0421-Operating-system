apiVersion: apps/v1
kind: Deployment
metadata: {name: lms}
spec:
  replicas: 2
  selector: {matchLabels: {app: lms}}
  template:
    metadata: {labels: {app: lms}}
    spec:
      containers:
      - name: lms
        image: moodle/placeholder:latest
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: lms}
spec: {selector: {app: lms}, ports: [{port: 80, targetPort: 8080}]}
